# Activer après création du DNS et du certificat TLS.
server {
    listen 80;
    server_name simularbre.levergerdesplumes.fr;
    return 301 https://simularbre.levergerdesplumes.fr$request_uri;
}

server {
    listen 443 ssl;
    server_name simularbre.levergerdesplumes.fr;
    root /var/www/simularbre;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/simularbre.levergerdesplumes.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simularbre.levergerdesplumes.fr/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        return 404;
    }
    location ~* \.(html|js|css|svg)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}

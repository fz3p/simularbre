# Vhost HTTP temporaire utilisé par Certbot pour créer le certificat initial.
<VirtualHost *:80>
    ServerName simularbre.levergerdesplumes.fr
    DocumentRoot /var/www/simularbre
    <Directory /var/www/simularbre>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>
</VirtualHost>

# Activer après création du DNS et du certificat TLS.
# Modules Apache : ssl, headers, rewrite.
<VirtualHost *:80>
    ServerName simularbre.levergerdesplumes.fr
    DocumentRoot /var/www/simularbre
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://simularbre.levergerdesplumes.fr%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName simularbre.levergerdesplumes.fr
    DocumentRoot /var/www/simularbre
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/simularbre.levergerdesplumes.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/simularbre.levergerdesplumes.fr/privkey.pem

    <Directory /var/www/simularbre>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Strict-Transport-Security "max-age=31536000"
    <FilesMatch "\.(html|js|css|svg)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</VirtualHost>
</IfModule>
